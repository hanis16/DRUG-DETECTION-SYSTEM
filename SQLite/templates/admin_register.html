<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Registration</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: url("/static/images/bg.jpg") no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
}

        .register-box {
    width: 360px;
    margin: 80px auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 16px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
        }
button {
    width: 100%;
    padding: 8px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
}

button:hover {
    background-color: #1d4ed8;
}

.btn-secondary {
    display: inline-block;
    padding: 8px 14px;
    background: #6b7280;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

.btn-secondary:hover {
    background: #4b5563;
}
    </style>
</head>
<body>

<div class="register-box">
    <h2>Admin Registration</h2>

    <form method="post">
        <input type="text" name="real_name" placeholder="Full Name" required>
        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <input type="text" name="reg_no" placeholder="Registration Number" required>

        <select name="country" required>
            <option value="">Select Country</option>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Other</option>
        </select>

        <input type="date" name="dob" required>

        <button type="submit">Register</button>
    </form>
    <br>
<a href="{{ url_for('admin_login') }}" class="btn-secondary">
    ← Back to Login
</a>
</div>

</body>
</html>
